spring.application.name=Schedule AIC Backend
spring.main.lazy-initialization=true
spring.jpa.properties.hibernate.generate_statistics=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:schedule}?useSSL=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Sandal1.}
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=25

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

management.endpoints.web.exposure.include=*
management.endpoint.loggers.enabled=true
management.endpoint.metrics.enabled=true
management.exchange.recording.enabled=true
management.endpoint.exchange.enabled=true
management.endpoint.info.enabled=true

server.forward-headers-strategy=FRAMEWORK

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html,text/plain
server.compression.max-response-size=1024

server.error.whitelabel.enabled=false

spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.date-format=yyyy-MMMM-dd

logging.level.root=INFO